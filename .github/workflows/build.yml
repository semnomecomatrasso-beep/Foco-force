name: Build APK and publish GitHub Release

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair ZIP e localizar projeto Gradle
        id: project
        shell: bash
        run: |
          set -e
          # Extrai um ZIP se o repositório tiver o projeto compactado.
          for ZIP in projeto.zip FOCUS_FORCE_projeto.zip FOCUS_FORCE_projeto_corrigido.zip; do
            if [ -f "$ZIP" ]; then
              mkdir -p extracted
              unzip -o "$ZIP" -d extracted
              break
            fi
          done

          # Procura settings.gradle(.kts) no repositório e na pasta extraída.
          ROOT="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path './.gradle/*' -not -path './*/.gradle/*' -print -quit | xargs -r dirname)"

          # Fallback: alguns projetos podem ter apenas build.gradle na raiz.
          if [ -z "$ROOT" ]; then
            ROOT="$(find . -type f \( -name build.gradle -o -name build.gradle.kts \) \
              -not -path './.github/*' -not -path './*/.github/*' -print -quit | xargs -r dirname)"
          fi

          if [ -z "$ROOT" ] || [ ! -f "$ROOT/build.gradle" -a ! -f "$ROOT/build.gradle.kts" ]; then
            echo "::error::Não encontrei a raiz do projeto Gradle. O ZIP precisa conter settings.gradle e build.gradle na pasta principal do projeto."
            echo "Arquivos encontrados:"
            find . -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          ROOT="$(realpath "$ROOT")"
          echo "dir=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Projeto Gradle encontrado em: $ROOT"
          ls -la "$ROOT"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Aceitar licenças Android
        run: yes | sdkmanager --licenses || true

      - name: Compilar APK
        run: gradle --no-daemon -p "${{ steps.project.outputs.dir }}" assembleDebug

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: focus-force-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar APK na aba Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
