name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair ZIP do projeto se enviado junto
        run: |
          ZIP=""
          if [ -f projeto.zip ]; then ZIP="projeto.zip"; fi
          if [ -z "$ZIP" ] && [ -f FOCUS_FORCE_projeto.zip ]; then ZIP="FOCUS_FORCE_projeto.zip"; fi
          if [ -n "$ZIP" ]; then
            mkdir -p extracted
            unzip -o "$ZIP" -d extracted
            if [ -f extracted/settings.gradle ]; then cp -a extracted/. .; fi
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Compilar APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: focus-force-debug-apk
          path: app/build/outputs/apk/debug/*.apk
