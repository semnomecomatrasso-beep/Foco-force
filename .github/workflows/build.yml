name: Build APK and publish GitHub Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Extrair ZIP do projeto, se necessário
        shell: bash
        run: |
          ZIP=""
          if [ -f projeto.zip ]; then ZIP="projeto.zip"; fi
          if [ -z "$ZIP" ] && [ -f FOCUS_FORCE_projeto.zip ]; then ZIP="FOCUS_FORCE_projeto.zip"; fi
          if [ -n "$ZIP" ]; then
            mkdir -p extracted
            unzip -o "$ZIP" -d extracted
            if [ -f extracted/settings.gradle ]; then
              cp -a extracted/. .
            else
              ROOT="$(find extracted -mindepth 2 -maxdepth 3 -name settings.gradle -print -quit)"
              if [ -n "$ROOT" ]; then cp -a "$(dirname "$ROOT")"/. .; fi
            fi
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # Não usar android-actions/setup-android@v3 aqui:
      # a action tentou instalar o pacote antigo "tools", que não existe mais no SDK.
      - name: Verificar Android SDK disponível no runner
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          if [ -z "${ANDROID_HOME:-}" ] && [ -d "/usr/local/lib/android/sdk" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          fi
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK não encontrado no runner."
            exit 1
          fi
          echo "SDK encontrado em: $SDK"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          elif [ -x "$SDK/tools/bin/sdkmanager" ]; then
            yes | "$SDK/tools/bin/sdkmanager" --licenses || true
            "$SDK/tools/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          else
            echo "SDK manager não encontrado; usando componentes já instalados no runner."
          fi

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: focus-force-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar APK na aba Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
